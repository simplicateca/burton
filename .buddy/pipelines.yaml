
# ======================
# Pipelines
# ======================

# Staging
- pipeline: "Build & Deploy to Staging"
  extends: deploy-template
  events:
    - type: PUSH
      refs:
        - refs/heads/staging
  variables:
    - key: "RELEASE_KEEP"
      value: "6"         # keep fewer releases on staging
    - key: "RELEASE_SYMLINK"
      value: "current"   # staging symlink
    - key: "FRONTEND_IMAGE_TAG"
      value: "lts"       # default Node

# Production
- pipeline: "Build & Deploy to Production"
  extends: deploy-template
  events:
    - type: PUSH
      refs:
        - refs/heads/prod
  variables:
    - key: "RELEASE_KEEP"
      value: "10"        # keep more releases on production
    - key: "RELEASE_SYMLINK"
      value: "live"      # production symlink
    - key: "FRONTEND_IMAGE_TAG"
      value: "20"        # lock prod builds to Node 20
