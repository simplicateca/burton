
# ======================
# Pipelines
# ======================

# Staging
- pipeline: "staging"
  extends: deploy-template
  events:
    - type: PUSH
      refs:
        - refs/heads/staging
  variables:
    - key: "RELEASE_KEEP"
      value: "5"
    - key: "RELEASE_SYMLINK"
      value: "current"
    - key: "FRONTEND_IMAGE_TAG"
      value: "lts"

# Production
- pipeline: "production"
  extends: deploy-template
  events:
    - type: PUSH
      refs:
        - refs/heads/prod
  variables:
    - key: "RELEASE_KEEP"
      value: "10"        # keep more releases on production
    - key: "RELEASE_SYMLINK"
      value: "live"      # production symlink
    - key: "FRONTEND_IMAGE_TAG"
      value: "20"        # lock prod builds to Node 20
